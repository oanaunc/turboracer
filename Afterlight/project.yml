name: Afterlight
options:
  bundleIdPrefix: com.oanarinaldi
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: HBD3XXQK45
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '20'
targets:
  Afterlight:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes: ["Models/*.blend", "Models/*.blend1", "Models/*.obj", "Models/*.mtl"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oanarinaldi.afterlight
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 'Afterlight'
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIStatusBarHidden: true
        ITSAppUsesNonExemptEncryption: false
  AfterlightTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Afterlight
  AfterlightUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Afterlight
schemes:
  Afterlight:
    build:
      targets:
        Afterlight: all
    test:
      targets: [AfterlightTests, AfterlightUITests]
